[project]
name = "ai-agent-task"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eero Saarro", email = "eero.saarro@digitalworkforce.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.16.2",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[project.scripts]
ai-agent-task = "ai_agent_task:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
